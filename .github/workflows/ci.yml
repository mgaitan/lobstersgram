name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "**.py"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    paths:
      - "**.py"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  workflows-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub workflows
        uses: rhysd/actionlint@v1.7.9

  qa:
    needs: workflows-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7

      - name: Ruff check
        run: uv run --group dev ruff check --output-format=github

      - name: Ruff format
        run: uv run --group dev ruff format --check

  test:
    needs: qa
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Run tests
        run: uv run --group dev -p ${{ matrix.python-version }} pytest
