[project]
name = "markdown-web"
version = "0.1.9"
description = "Minimal web service for extracting Markdown and publishing it to Telegraph"
readme = "README.md"
authors = [{ name = "Martín Gaitán", email = "gaitan@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["markdown", "telegraph", "fastapi", "bookmarklet"]
dependencies = [
    "fastapi[standard]>=0.116.1",
    "firecrawl-anydoc>=0.1.6",
    "jinja2>=3.1.6",
    "markdown-this>=0.1.8",
    "md-to-telegraph @ git+https://github.com/mgaitan/lobstersgram.git@98873b7750ee834cf3dfd33fdd0cb52a5a864951#subdirectory=packages/md-to-telegraph",
    "python-dotenv>=1.2.1",
    "pypdf>=5.0.0",
    "pyyaml>=6.0.3",
    "redis>=6.4.0",
    "requests>=2.32.5",
    "uvicorn[standard]>=0.35.0",
]

[project.urls]
Homepage = "https://github.com/mgaitan/lobstersgram/tree/master/packages/markdown-web"
Repository = "https://github.com/mgaitan/lobstersgram"
Issues = "https://github.com/mgaitan/lobstersgram/issues"

[project.scripts]
markdown-web = "markdown_web.cli:main"

[build-system]
requires = ["uv_build>=0.7,<0.12"]
build-backend = "uv_build"
