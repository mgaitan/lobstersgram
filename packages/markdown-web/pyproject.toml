[project]
name = "markdown-web"
version = "0.1.7"
description = "Minimal web service for extracting Markdown and publishing it to Telegraph"
readme = "README.md"
authors = [{ name = "Martín Gaitán", email = "gaitan@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["markdown", "telegraph", "fastapi", "bookmarklet"]
dependencies = [
    "fastapi[standard]>=0.116.1",
    "jinja2>=3.1.6",
    "markdown-this>=0.1.6",
    "md-to-telegraph>=0.1.6",
    "requests>=2.32.5",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
jobs = ["redis>=6.4.0"]

[dependency-groups]
deploy = ["redis>=6.4.0"]

[tool.uv]
default-groups = ["deploy"]

[project.urls]
Homepage = "https://github.com/mgaitan/lobstersgram/tree/master/packages/markdown-web"
Repository = "https://github.com/mgaitan/lobstersgram"
Issues = "https://github.com/mgaitan/lobstersgram/issues"

[project.scripts]
markdown-web = "markdown_web.cli:main"

[build-system]
requires = ["uv_build>=0.7,<0.12"]
build-backend = "uv_build"
